[bar.default]
capsule = true
capsule_radius = 0
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "volume", "cpu", "brightness" ]
margin_ends = 0
radius = 0
start = [ "workspaces", "media" ]
thickness = 32

[control_center]
sidebar = "none"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 3600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false
wallpaper = "~/Pictures/Wallpapers/01.jpg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 854.0
    cy = 948.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[osd]
position = "top_right"
position_vertical = "top_right"

    [osd.kinds]
    media = false

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
polkit_agent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    categories = false
    session_search = true

    [shell.panel]
    clipboard_placement = "attached"
    control_center_position = "top_right"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        variant = "destructive"

[theme]
source = "wallpaper"
wallpaper_scheme = "muted"

[wallpaper]
directory = "~/Pictures/Wallpapers"
edge_smoothness = 0.0
transition = [ "zoom" ]

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/01.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/01.jpg"

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M - %d/%m}"

[widget.cpu]
display = "text"
stat = "cpu_temp"

[widget.launcher]
glyph = "apps"

[widget.media]
album_art_only = true
hide_when_no_media = true
max_length = 150

[widget.network]
show_label = false

[widget.tray]
drawer = true
